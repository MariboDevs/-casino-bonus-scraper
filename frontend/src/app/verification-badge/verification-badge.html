@switch (kind()) {
  @case ('checked') {
    <span class="badge badge--checked" title="Every figure was found in the operator's own terms">
      <span class="ms" aria-hidden="true">check</span>Checked
    </span>
  }
  @case ('reviewText') {
    <span class="badge badge--review-text">
      <span class="ms" aria-hidden="true">article</span
      >{{ compact() ? 'Review text' : 'Checked against review text' }}
    </span>
  }
  @default {
    <span class="badge badge--needs-review">
      <span class="ms" aria-hidden="true">flag</span>Needs review
    </span>
  }
}
