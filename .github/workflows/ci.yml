name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BonusScraper.slnx

      - name: Build (warnings are errors, vulnerable packages fail restore)
        run: dotnet build BonusScraper.slnx --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test BonusScraper.slnx --no-build -c Release
          --filter "FullyQualifiedName!~BonusScraper.IntegrationTests"
          --logger "trx;LogFilePrefix=unit" --results-directory TestResults

      - name: Integration tests (SQL Server 2022 in Docker)
        run: >
          dotnet test tests/BonusScraper.IntegrationTests --no-build -c Release
          --logger "trx;LogFilePrefix=integration" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Build page (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - name: Build
        run: npx ng build --base-href ./
